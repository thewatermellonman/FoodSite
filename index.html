<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <title>FFT Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top">
        <button type="button" class="img-btn">
            <img src="LOGO.png" class="logo" alt="Food for Thought Food Pantry">
        </button>
        <h1 class="title">Food for Thought RCHS</h1>
    </div>
        
    <div class="main content">
        <div class="topimg">
            <div class="hero">
                <div class="overtext">
                    <h1>Food For Thought</h1>
                    <h3>at RCHS</h3>
                </div>
            </div>
         </div>

        <div class="scuffcont">
            <div class="dailyfood">
                <div class="dailytext box">
                    <h1>FREE Food Order</h1>
                    <h3>
                        Food ready to order, and availible the next school day.
                        Has options of breakfast, lunch, and dinner. 
                    </h3>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfYWMsxaork2UKcwcg6nlSkzKoAOBkLLfc8as68UBx0Hy1kcA/viewform" class="dailybutton">Food Order Form</a>
                </div>
                <div class="menu box">
                    <img src="Menu daily.png" class="dailymenu" alt="Our daily menu, see more on the food order form">
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
    <div class="top-row">
        <div class="footer-col logo-col">
            <div class="low-logo">
                <img src="LOGO.png" class="logo" alt="Food for Thought Food Pantry">
            </div>
        </div>
    </div>

    <div class="footer-col">
        <h3>Location</h3>
        <p>12345 drive</p>
    </div>

    <div class="footer-col">
        <h3>Contact</h3>
        <p>foodforthoughtrchs@gmail.com</p>
    </div>
</footer>
</body>

</html>
